<text x="335" y="1768" class="">uses</text>
<text x="760" y="1280" class="">Key: + public, - private. Void = no result (Python None).</text>
<text x="760" y="1310" class="">common... = product_id: String, name: String, price: Real,</text>
<text x="760" y="1340" class="">    stock: Integer (constructor order).</text>
<text x="760" y="1370" class="">Hollow triangle, solid line = inherits; dashed = implements.</text>
<text x="760" y="1400" class="">Dashed open arrow «creates» = dependency: ProductFactory</text>
<text x="760" y="1430" class="">    builds Products but does not keep a reference to them.</text>
<text x="760" y="1460" class="">Order —&gt; DiscountStrategy = association: each Order uses</text>
<text x="760" y="1490" class="">    exactly 1 strategy (NoDiscount by default); one strategy</text>
<text x="760" y="1520" class="">    object can be shared by 0..* Orders.</text>
<text x="25" y="2700" class="">Lab 9 §6: Strategy (DiscountStrategy family) and Factory (ProductFactory «creates» Product) added to the Lab 8 diagram.</text>
