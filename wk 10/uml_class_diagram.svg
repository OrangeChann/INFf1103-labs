<text x="1490" y="1682" class="">creates / owns</text>
<path d="M320 1790 V1674" class="edge" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="335" y="1768" class="">uses</text>
<text x="760" y="1285" class="">Visibility: + public; - private. Void = Python None.</text>
<text x="760" y="1320" class="">common... = product_id: String, name: String,</text>
<text x="760" y="1345" class="">price: Real, stock: Integer (constructor order).</text>
<text x="760" y="1380" class="">ProductRecord = typed JSON record; subtype fields</text>
<text x="760" y="1405" class="">are optional. SupplierRecord = Map&lt;String, String&gt;.</text>
<text x="760" y="1440" class="">Snapshots contain the same referenced objects.</text>
<text x="760" y="1475" class="">OrderLine lifecycle belongs to one Order;</text>
<text x="760" y="1500" class="">the referenced Product remains independent.</text>
<text x="760" y="1535" class="">Supplier IDs and Order IDs identify domain records.</text>
<text x="25" y="2040" class="">Lab 8 §8 review: plain association for Supplier/Product and OrderLine/Product; shared aggregation for Inventory/Product.</text>
